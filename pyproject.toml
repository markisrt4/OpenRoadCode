[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "build",
    "venv",
    "apps/deprecated",
    "hardware_io/potentiometer/MultiTurnPot.py",
]

[tool.ruff.lint]
# Begin with high-confidence correctness failures so CI can be enabled without
# demanding a repository-wide style cleanup in the same change. Expand this
# ruleset as existing code is brought under lint discipline.
select = [
    "E9",
    "F63",
    "F7",
    "F82",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openroad-ui-contracts"
version = "0.1.0"
description = "Toolkit-independent state and request contracts for interchangeable vehicle UIs"
requires-python = ">=3.12"
dependencies = ["tinycss2>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ui", "ui.*"]
exclude = ["*.unit_test", "*.unit_test.*", "*.component_test", "*.component_test.*"]
