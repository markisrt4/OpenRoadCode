[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "build",
    "venv",
]

[tool.ruff.lint]
# Start with correctness-oriented rules that are safe to enforce across the
# existing repository. Broader style rules can be enabled incrementally.
select = [
    "E4",
    "E7",
    "E9",
    "F",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
