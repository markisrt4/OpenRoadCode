<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenRoadCode WebGL Visualizer</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#020509;color:#edf2f5}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020509}
    #stage{position:fixed;inset:0}canvas{width:100%;height:100%;display:block}
    #hud{position:fixed;left:14px;right:14px;top:12px;display:flex;gap:12px;align-items:center;padding:10px 12px;background:#071019dc;border:1px solid #25313b;border-radius:6px;backdrop-filter:blur(8px)}
    .brand{font-weight:800;letter-spacing:.08em}.o{color:#168bd1}.r{color:#f15a16}.c{color:#84ce1f}.sub{color:#89959e;font-size:12px;margin-left:8px}.spacer{flex:1}
    select,button{background:#101820;color:#edf2f5;border:1px solid #31424f;border-radius:4px;padding:8px 10px;font-weight:700}button{cursor:pointer}
    #status{position:fixed;left:16px;bottom:12px;font:12px ui-monospace,monospace;color:#89959e;background:#020509aa;padding:5px 7px;border-radius:3px}
  </style>
</head>
<body>
  <div id="stage"><canvas id="gl"></canvas></div>
  <div id="hud">
    <div class="brand"><span class="o">O</span><span class="r">R</span><span class="c">C</span><span class="sub">WEBGL VISUALIZER</span></div>
    <div class="spacer"></div>
    <select id="mode">
      <option value="0">Spectrum</option>
      <option value="1">Orbiting Planets</option>
      <option value="2">Electric Freeway</option>
      <option value="3">Explosion Field</option>
      <option value="4">Star Dance</option>
      <option value="5">Electric Rings</option>
      <option value="6">Neon Ribbon</option>
      <option value="7">Kaleidoscope</option>
    </select>
    <button id="fullscreen">FULL SCREEN</button>
  </div>
  <div id="status">SIMULATED AUDIO · WEBGL</div>
  <script src="visualizer.js"></script>
</body>
</html>
