name: Quality checks

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test documentation inventory
        run: python -m unittest discover -s ci/unit_test -p 'test_docs_inventory.py'

      - name: Validate generated documentation index
        run: python ci/docs_inventory.py --check

      - name: Validate Markdown links
        run: python ci/check_markdown_links.py

      - name: Validate Mermaid legends
        run: python ci/check_mermaid_legends.py

      - name: Validate Doxygen contracts
        run: python ci/check_doxygen_contracts.py

      - name: Cache pinned Doxygen
        uses: actions/cache@v4
        with:
          path: .venv-quality/tools
          key: doxygen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/install_quality_doxygen.sh') }}

      - name: Install Doxygen
        run: |
          python -m venv .venv-quality
          bash ci/install_quality_doxygen.sh

      - name: Generate Doxygen documentation
        shell: bash
        run: |
          mkdir -p build
          rm -f build/doxygen-warnings.log

          set +e
          .venv-quality/bin/doxygen Doxyfile
          doxygen_status=$?
          set -e

          if [[ -s build/doxygen-warnings.log ]]; then
            echo "Doxygen warnings:" >&2
            cat build/doxygen-warnings.log >&2
          fi

          if (( doxygen_status != 0 )); then
            exit "$doxygen_status"
          fi

          test ! -s build/doxygen-warnings.log

  logging:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Logging quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install logging test dependencies
        run: |
          python -m pip install -c constraints-quality-linux.txt pytest requests pyzmq Pillow
          sudo apt-get update
          sudo apt-get install --yes cmake pkg-config libspdlog-dev rapidjson-dev libzmq3-dev cppzmq-dev

      - name: Verify Python logging and subsystem behavior
        env:
          ORC_LOG_DIR: ${{ runner.temp }}/orc-logging
        run: python -m pytest -q common/logging/unit_test

      - name: Compile native logging and command receiver
        run: |
          cmake -S apps/map_renderer/component_test -B build/logging -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build build/logging --parallel 2

      - name: Verify native logging contract
        run: ctest --test-dir build/logging --output-on-failure

  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install isolated quality environment
        run: bash ci/setup_quality_env.sh

      - name: Run static quality gates
        run: bash ci/dev_check.sh --all

      - name: Run integration tests
        run: .venv-quality/bin/python ci/run_tests.py integration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test browser audio lifecycle
        run: node --test frontends/web/audio_analysis/unit_test/*.js

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n development/termux/build_navigation_stack.sh
          bash -n scripts/runit/install_termux_services.sh
          bash -n scripts/runit/openroadcode-adsb/run
          bash -n scripts/systemd/install_service_manager_systemd.sh
          bash -n development/debian/install_streaming_radio.sh
          bash -n development/termux/install_streaming_radio.sh
          bash -n development/docs/docs-preview.sh

      - name: Check source-tree runtime state
        shell: bash
        run: |
          if find scripts/runit -type d -name supervise -print -quit | grep -q .; then
            echo "Runtime supervise directory found in source tree:" >&2
            find scripts/runit -type d -name supervise -print >&2
            exit 1
          fi

      - name: Check repository whitespace
        run: git diff --check
