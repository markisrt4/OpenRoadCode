name: Quality checks

on:
  pull_request:
  push:
    branches:
      - master
      - weather-radar
      - automotive
      - runtime-integration-cleanup
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test documentation inventory
        run: python -m unittest discover -s scripts/unit_test -p 'test_docs_inventory.py'

      - name: Validate generated documentation index
        run: python scripts/docs_inventory.py --check

      - name: Validate Markdown links
        run: python scripts/check_markdown_links.py

      - name: Validate Mermaid legends
        run: python scripts/check_mermaid_legends.py

      - name: Validate Doxygen contracts
        run: python scripts/check_doxygen_contracts.py

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen

      - name: Generate Doxygen documentation
        shell: bash
        run: |
          mkdir -p build
          rm -f build/doxygen-warnings.log

          set +e
          doxygen Doxyfile
          doxygen_status=$?
          set -e

          if [[ -s build/doxygen-warnings.log ]]; then
            echo "Doxygen warnings:" >&2
            cat build/doxygen-warnings.log >&2
          fi

          if (( doxygen_status != 0 )); then
            exit "$doxygen_status"
          fi

          test ! -s build/doxygen-warnings.log

  logging:
    name: Logging quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install logging test dependencies
        run: |
          python -m pip install pytest requests pyzmq
          sudo apt-get update
          sudo apt-get install --yes cmake pkg-config libspdlog-dev rapidjson-dev libzmq3-dev cppzmq-dev

      - name: Verify Python logging and navigation correlation
        env:
          ORC_LOG_DIR: ${{ runner.temp }}/orc-logging
        run: python -m pytest -q common/logging/unit_test

      - name: Compile native logging and command receiver
        run: |
          cmake -S apps/map_renderer/component_test -B build/logging -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build build/logging --parallel 2

      - name: Verify native logging contract
        run: ctest --test-dir build/logging --output-on-failure

  validate:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install OpenRoadCode Python dependencies
        shell: bash
        run: |
          source scripts/installers/installer_features.sh
          mapfile -t features < <(get_all_features_for_target linux-dev)
          ./scripts/installers/install_python_env.sh "${features[@]}"
          venv/bin/python -m pip install pytest ruff

      - name: Lint Python
        run: venv/bin/python -m ruff check .

      - name: Check Python module size
        run: venv/bin/python scripts/check_python_module_size.py

      - name: Enforce project-wide UI boundaries
        run: venv/bin/python scripts/check_ui_boundaries.py

      - name: Enforce weather UI contract boundaries
        run: venv/bin/python scripts/check_weather_ui_contracts.py

      - name: Run unit and integration tests
        run: venv/bin/python scripts/run_tests.py all

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test browser audio lifecycle
        run: node --test frontends/web/audio_analysis/unit_test/*.js

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n development/termux/build_navigation_stack.sh
          bash -n scripts/runit/install_termux_services.sh
          bash -n scripts/runit/openroadcode-adsb/run
          bash -n scripts/systemd/install_service_manager_systemd.sh
          bash -n development/debian/install_streaming_radio.sh
          bash -n development/termux/install_streaming_radio.sh
          bash -n scripts/docs-preview.sh

      - name: Check source-tree runtime state
        shell: bash
        run: |
          if find scripts/runit -type d -name supervise -print -quit | grep -q .; then
            echo "Runtime supervise directory found in source tree:" >&2
            find scripts/runit -type d -name supervise -print >&2
            exit 1
          fi

      - name: Check repository whitespace
        run: git diff --check
