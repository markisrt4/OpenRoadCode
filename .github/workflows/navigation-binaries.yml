name: Navigation binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            target: linux-dev
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: rpi5
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        working-directory: OpenRoadCode
    steps:
      - uses: actions/checkout@v4
        with:
          path: OpenRoadCode
      - name: Install host runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync python3-zmq
          bash development/containers/maplibre/host_setup.sh
          bash development/containers/valhalla/host_setup.sh
      - name: Build navigation software
        env:
          HOST_SRC: ${{ github.workspace }}
          BUILD_JOBS: "2"
          FORCE_NAVIGATION_REBUILD: "1"
        run: |
          bash scripts/installers/install_navigation_stack.sh \
            --target "${{ matrix.target }}" --skip-host-packages --skip-services
      - name: Package and checksum
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          name="orc-navigation-ubuntu24.04-${ARCH}-${GITHUB_SHA}"
          printf 'revision=%s\nos=ubuntu\nversion=24.04\narchitecture=%s\n' \
            "$GITHUB_SHA" "$ARCH" > dist/manifest.txt
          sudo tar -C /opt/openroadcode/navigation -czf "$PWD/dist/$name.tar.gz" bin valhalla
          sudo chown "$(id -u):$(id -g)" "dist/$name.tar.gz"
          (cd dist && sha256sum "$name.tar.gz" manifest.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: navigation-ubuntu24.04-${{ matrix.arch }}
          path: OpenRoadCode/dist/
          if-no-files-found: error
          retention-days: 14
