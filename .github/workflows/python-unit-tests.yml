name: OpenRoadCode CI
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, converted_to_draft]
  workflow_call:
    inputs:
      full_gate:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_gate:
        description: Run the full portable quality gate
        type: boolean
        default: false
concurrency:
  group: orc-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fast:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.12'
      - name: Install verification dependencies
        run: |
          bash ci/setup_quality_env.sh
          echo "$PWD/.venv-quality/bin" >> "$GITHUB_PATH"
      - name: Focused architecture checks
        run: |
          python ci/check_python_module_size.py
          python ci/check_ui_boundaries.py
      - name: Games panel layout with X11
        run: xvfb-run -a python -m pytest -q -rs frontends/tk/games/unit_test/test_games_panel_layout.py
      - name: Unit tests
        run: |
          python - <<'PY'
          from ci.run_tests import find_suites
          import subprocess
          import sys
          dirs = [str(p) for p in find_suites('unit')]
          if not dirs:
              sys.exit('No unit_test directories with test_*.py files found')
          sys.exit(subprocess.call([sys.executable, '-m', 'pytest', '-q', '--maxfail=1', '--junitxml=unit-test-results.xml', *dirs]))
          PY
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orc-unit-test-results
          path: unit-test-results.xml
          if-no-files-found: ignore
  full:
    if: inputs.full_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.12'
      - name: Install quality gate dependencies
        run: |
          bash ci/setup_quality_env.sh
          echo "$PWD/.venv-quality/bin" >> "$GITHUB_PATH"
      - name: Run portable full quality gate
        run: python ci/quality_gate.py
