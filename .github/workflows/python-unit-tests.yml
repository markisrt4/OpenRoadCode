name: OpenRoadCode CI
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full_gate:
        description: Run the full portable quality gate
        type: boolean
        default: false
concurrency:
  group: orc-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          python -m pip install pytest numpy scipy PyYAML requests tinycss2 pyzmq Pillow flask ruff mypy
          python -m pip install 'libmusicforge[analysis] @ git+https://github.com/markisrt4/libMusicForge.git@main'
      - name: Focused architecture checks
        run: |
          python scripts/check_python_module_size.py
          python scripts/check_ui_boundaries.py
          python scripts/check_weather_ui_contracts.py
      - name: Unit tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          dirs = sorted(str(p) for p in Path('.').rglob('unit_test') if p.is_dir() and any(p.glob('test_*.py')))
          if not dirs:
              sys.exit('No unit_test directories with test_*.py files found')
          sys.exit(subprocess.call([sys.executable, '-m', 'pytest', '-q', '--maxfail=1', '--junitxml=unit-test-results.xml', *dirs]))
          PY
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orc-unit-test-results
          path: unit-test-results.xml
          if-no-files-found: ignore
  full:
    if: github.event_name == 'workflow_dispatch' && inputs.full_gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install quality gate dependencies
        run: |
          python -m pip install pytest numpy scipy PyYAML requests tinycss2 pyzmq Pillow flask ruff mypy
          python -m pip install 'libmusicforge[analysis] @ git+https://github.com/markisrt4/libMusicForge.git@main'
      - name: Run portable full quality gate
        run: python scripts/quality_gate.py
