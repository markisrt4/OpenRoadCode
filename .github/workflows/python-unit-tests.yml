name: Python unit tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.py'
      - 'pytest.ini'
      - 'pyproject.toml'
      - '.github/workflows/python-unit-tests.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy PyYAML requests
      - name: Run unit tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          dirs = sorted(str(p) for p in Path('.').rglob('unit_test') if p.is_dir() and any(p.glob('test_*.py')))
          if not dirs:
              sys.exit('No unit_test directories with test_*.py files found')
          print(f'Running tests from {len(dirs)} directories', flush=True)
          sys.exit(subprocess.call([sys.executable, '-m', 'pytest', '-q', '--disable-warnings', '--maxfail=1', *dirs]))
          PY
