name: Promote Navigation Data
on:
  push:
    branches: [feature/rpi5-integration]
    paths: ['.github/workflows/promote-navigation-data.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful regional navigation build run ID
        required: true
        default: '45507335279'
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.run_id || '45507335279' }}
    steps:
      - name: Verify source workflow
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > run.json
          jq -e '.conclusion == "success" and .path == ".github/workflows/build-regional-navigation-data.yml"' run.json
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          name: regional-navigation-data
          path: regional-artifacts
      - name: Verify and publish
        run: |
          set -euo pipefail
          revision=$(jq -r .head_sha run.json)
          cd regional-artifacts
          sha256sum -c SHA256SUMS
          tag="navigation-data-$SOURCE_RUN-1"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace assets."
            exit 1
          fi
          gh release create "$tag" --target "$revision" --prerelease --latest=false --title "Regional navigation data ($SOURCE_RUN)" --notes "Validated dataset from Actions run $SOURCE_RUN. See build-manifest.json for coverage." navigation-data.tar.gz.part-* build-manifest.json SHA256SUMS
