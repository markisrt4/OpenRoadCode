name: Build Metro Detroit map data

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag (defaults to metro-detroit-imagery-YYYYMMDD-runN)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: metro-detroit-imagery-release
  cancel-in-progress: false

jobs:
  build:
    name: Build draft map-data release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install map-data dependencies
        run: python -m pip install Pillow

      - name: Choose versioned release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="metro-detroit-imagery-$(date -u +%Y%m%d)-run${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$tag" =~ ^metro-detroit-imagery-[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Release tag must start with metro-detroit-imagery- and contain only letters, digits, dots, underscores, or hyphens"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; choose a new versioned tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download and validate Metro Detroit imagery
        run: |
          python -m development.maps.install_region \
            --coverage metro-detroit \
            --build-only build-output/metro-detroit-imagery \
            --detail \
            --yes

      - name: Download and validate tiled Metro Detroit terrain
        run: |
          python -m development.maps.install_terrain \
            --coverage metro-detroit \
            --build-only build-output/metro-detroit-terrain \
            --yes

      - name: Package checked map data
        run: |
          python -m tools.map_builder.builder.imagery_artifact \
            --coverage metro-detroit \
            --pack build-output/metro-detroit-imagery \
            --output build-output/artifacts/metro-detroit-imagery.zip

          python -m tools.map_builder.builder.terrain_artifact \
            --coverage metro-detroit \
            --pack build-output/metro-detroit-terrain \
            --output build-output/artifacts/metro-detroit-terrain.zip

      - name: Create draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            build-output/artifacts/metro-detroit-imagery.zip \
            build-output/artifacts/metro-detroit-imagery.zip.json \
            build-output/artifacts/metro-detroit-terrain.zip \
            build-output/artifacts/metro-detroit-terrain.zip.json \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Metro Detroit offline map data ${RELEASE_TAG#metro-detroit-imagery-}" \
            --notes "Offline Metro Detroit detail imagery and tiled USGS 3DEP terrain. Inspect both packages before publishing this draft release. Source provenance and checksums are included."

          descriptor_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/metro-detroit-imagery.zip.json"
          {
            echo "## Draft map-data release"
            echo
            echo "Inspect the imagery and terrain assets on the draft release, then publish it if they are acceptable."
            echo
            echo "After publication, install it with:"
            echo '```bash'
            echo 'git switch navigation-cesium'
            echo "python -m development.maps.install_region --coverage metro-detroit --pack-manifest ${descriptor_url}"
            echo "python -m development.maps.install_terrain --coverage metro-detroit --pack-manifest https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/metro-detroit-terrain.zip.json --yes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
