name: Build Michigan terrain shard

on:
  workflow_call:
    inputs:
      coverage:
        description: Statewide overview or detail shard
        required: true
        type: string
  workflow_dispatch:
    inputs:
      coverage:
        description: Statewide overview or detail shard
        required: true
        type: choice
        options:
          - michigan-overview
          - mi-lower-southwest
          - mi-lower-southeast
          - mi-lower-central-west
          - mi-lower-central-east
          - mi-lower-northwest
          - mi-lower-northeast
          - mi-upper-west
          - mi-upper-east

permissions:
  contents: write

concurrency:
  group: michigan-terrain-${{ inputs.coverage }}
  cancel-in-progress: false

jobs:
  build-row:
    name: Build terrain row ${{ matrix.row }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        row: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install map-data dependencies
        run: python -m pip install Pillow
      - name: Restore validated terrain row
        uses: actions/cache/restore@v4
        with:
          path: build-output/${{ inputs.coverage }}-terrain.download/r${{ matrix.row }}-c*
          key: terrain-row-v1-${{ inputs.coverage }}-${{ matrix.row }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            terrain-row-v1-${{ inputs.coverage }}-${{ matrix.row }}-
      - name: Build resumable terrain row
        id: terrain-row
        continue-on-error: true
        run: |
          python -m development.maps.build_terrain_row \
            --coverage "${{ inputs.coverage }}" \
            --row "${{ matrix.row }}" \
            --cache "build-output/${{ inputs.coverage }}-terrain.download"
      - name: Preserve validated terrain row
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: build-output/${{ inputs.coverage }}-terrain.download/r${{ matrix.row }}-c*
          key: terrain-row-v1-${{ inputs.coverage }}-${{ matrix.row }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report incomplete terrain row
        if: ${{ steps.terrain-row.outcome == 'failure' }}
        run: |
          echo "::error::Terrain row ${{ matrix.row }} stopped before all tiles validated. Rerun this coverage to restore completed tiles."
          exit 1
      - name: Upload validated terrain row
        if: ${{ steps.terrain-row.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: terrain-row-${{ inputs.coverage }}-${{ matrix.row }}
          path: build-output/${{ inputs.coverage }}-terrain.download/r${{ matrix.row }}-c*
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble checked terrain package
    needs: build-row
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install map-data dependencies
        run: python -m pip install Pillow
      - name: Download validated terrain rows
        uses: actions/download-artifact@v4
        with:
          pattern: terrain-row-${{ inputs.coverage }}-*
          path: build-output/${{ inputs.coverage }}-terrain.download
          merge-multiple: true
      - name: Validate and assemble terrain shard
        run: |
          python -m development.maps.install_terrain \
            --coverage "${{ inputs.coverage }}" \
            --build-only "build-output/${{ inputs.coverage }}-terrain" \
            --yes
      - name: Package checked terrain shard
        run: |
          python -m tools.map_builder.builder.terrain_artifact \
            --coverage "${{ inputs.coverage }}" \
            --pack "build-output/${{ inputs.coverage }}-terrain" \
            --output "build-output/${{ inputs.coverage }}-terrain.zip"
          python -m development.maps.terrain_regions \
            --output build-output/michigan-terrain-index.json
      - name: Create draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          COVERAGE: ${{ inputs.coverage }}
        run: |
          tag="michigan-terrain-${COVERAGE}-$(date -u +%Y%m%d)-run${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            "build-output/${COVERAGE}-terrain.zip" \
            "build-output/${COVERAGE}-terrain.zip.json" \
            build-output/michigan-terrain-index.json \
            --draft --target "$GITHUB_SHA" \
            --title "Michigan terrain · ${COVERAGE}" \
            --notes "Offline rectangular USGS 3DEP terrain shard. Inspect coverage, size, and rendering before publishing."
