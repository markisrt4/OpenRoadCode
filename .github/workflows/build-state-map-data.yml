name: Build state map data

on:
  workflow_dispatch:
    inputs:
      state:
        description: State name, postal abbreviation, or FIPS code
        required: true
        type: string
      scope:
        description: Coverage tier to build
        required: true
        type: choice
        default: all
        options: [overview, detail, all]
      force_rebuild:
        description: Ignore matching artifact caches
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      state:
        description: State name, postal abbreviation, or FIPS code
        required: true
        type: string
      scope:
        description: Coverage tier to build
        required: true
        type: string
      force_rebuild:
        description: Ignore matching artifact caches
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: state-map-data-${{ inputs.state }}-${{ inputs.scope }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.plan.outputs.state }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        run: |
          plan="$(python -m development.maps.state_map_catalog --state '${{ inputs.state }}' --scope '${{ inputs.scope }}' --matrix)"
          echo "state=$(jq -r .state <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c .coverage <<<"$plan")" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        coverage: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/build-michigan-terrain.yml
    with:
      coverage: ${{ matrix.coverage }}
      force_rebuild: ${{ inputs.force_rebuild }}
      publish_release: false
    secrets: inherit

  release:
    needs: [prepare, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: map-data-*
          path: build-output/state
          merge-multiple: true
      - name: Create checked state draft release
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ needs.prepare.outputs.state }}
          SCOPE: ${{ inputs.scope }}
        run: |
          tag="${STATE}-map-data-${SCOPE}-$(date -u +%Y%m%d)-run${GITHUB_RUN_NUMBER}"
          gh release create "$tag" build-output/state/* \
            --draft --target "$GITHUB_SHA" \
            --title "${STATE^^} offline map data · ${SCOPE}" \
            --notes "State-driven USGS NAIP imagery and 3DEP terrain. Coverage assets are independently resumable and share the checked state catalog."
          echo "Draft release: $tag" >> "$GITHUB_STEP_SUMMARY"
