name: Quality checks

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Unit tests and interface documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install OpenRoadCode Python dependencies
        shell: bash
        run: |
          source scripts/installers/installer_features.sh
          mapfile -t features < <(get_all_features_for_target linux-dev)
          ./scripts/installers/install_python_env.sh "${features[@]}"
          venv/bin/python -m pip install pytest

      - name: Run unit tests
        run: venv/bin/python scripts/run_tests.py unit

      - name: Run integration tests
        run: venv/bin/python scripts/run_tests.py integration

      - name: Validate Doxygen contracts
        run: venv/bin/python scripts/check_doxygen_contracts.py
