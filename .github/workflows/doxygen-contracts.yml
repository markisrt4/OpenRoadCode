name: Quality checks

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Unit tests and interface documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run unit tests
        run: python scripts/run_tests.py unit

      - name: Run integration tests
        run: python scripts/run_tests.py integration

      - name: Validate Doxygen contracts
        run: python scripts/check_doxygen_contracts.py
