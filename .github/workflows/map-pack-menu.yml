name: Map pack menu checks
on:
  push:
    paths:
      - development/maps/download_us_terrain.py
      - tools/map_builder/tests/test_download_us_terrain.py
      - development/maps/build_reference_globe.py
      - tools/map_builder/tests/test_reference_globe_image.py
      - apps/launchers/cesium_viewer_server.py
      - resources/maps/world_reference.png
      - frontends/web/cesium/reference_globe_layer.js
      - frontends/web/cesium/map_layer_controls.js
      - frontends/web/cesium/unit_test/test_reference_globe_layer.js
      - frontends/web/cesium/unit_test/test_map_layer_controls.js
      - tools/map_builder/builder/map_pack_menu.py
      - tools/map_builder/builder/map_pack_selection.py
      - tools/map_builder/builder/map_pack_builds.py
      - .github/workflows/build-metro-detroit-imagery.yml
      - tools/map_builder/tests/test_map_pack_menu.py
      - tools/map_builder/scripts/run-builder.sh
      - .github/workflows/map-pack-menu.yml
      - .github/workflows/us-coarse-terrain.yml
      - development/maps/build_us_terrain.py
      - development/maps/static_region_sources.py
      - development/maps/static_tile_trial.py
      - tools/map_builder/tests/test_source_metadata_retry.py
      - tools/map_builder/tests/test_statewide_resume.py
      - development/maps/resume_statewide_detail.py
      - development/maps/download_statewide_detail.py
      - .github/workflows/michigan-statewide-detail.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest Pillow
      - run: python -m pytest tools/map_builder/tests/test_map_pack_menu.py tools/map_builder/tests/test_source_metadata_retry.py tools/map_builder/tests/test_statewide_resume.py apps/launchers/unit_test/test_static_region_build.py tools/map_builder/tests/test_reference_globe_image.py apps/launchers/unit_test/test_local_imagery_pack.py tools/map_builder/tests/test_download_us_terrain.py -q
      - name: Offline globe reference and layer visibility regressions
        run: node --test frontends/web/cesium/unit_test/test_reference_globe_layer.js frontends/web/cesium/unit_test/test_map_layer_controls.js
      - name: Host entry cancels without needing Docker
        run: |
          printf 'b\n' | CONTAINER_ENGINE=missing-engine bash tools/map_builder/scripts/run-builder.sh packs
      - name: Generate offline globe reference asset
        run: python -m development.maps.build_reference_globe --output world_reference.png
      - uses: actions/upload-artifact@v4
        with:
          name: world-reference-image
          path: world_reference.png
