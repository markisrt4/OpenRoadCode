# OpenRoadCode Termux runtime composition
#
# Use this profile for Termux/X11 integration and bench testing. Keep the core
# navigation service deterministic and available even when optional Android
# hardware bridges are not running.

[runtime]
remote_display = ":1"
auxiliary_display = ":1"
media_display = ":1"

[messaging]
publisher_endpoint = "tcp://127.0.0.1:5556"
subscriber_endpoint = "tcp://127.0.0.1:5557"

[services.navigation]
enabled = true
rate_hz = 20.0
command_endpoint = "tcp://127.0.0.1:5560"

# Do not make the entire navigation service depend on the optional Android IMU
# bridge. A stationary simulated IMU keeps map/position/navigation consumers
# alive during normal Termux UI development. Android IMU hardware can be tested
# with a hardware-specific runtime profile.
[services.navigation.inputs.imu]
source = "simulation"
device = "android"
bridge_url = "http://127.0.0.1:8766"

[services.navigation.inputs.imu.simulation]
profile = "stationary"

# GPS remains simulated in this profile until Android position is composed into
# the normal navigation service. This keeps this profile deterministic today.
[services.navigation.inputs.gps]
source = "simulation"

[services.navigation.inputs.gps.simulation]
profile = "stationary"
latitude_deg = 42.8028
longitude_deg = -83.0127
speed_mps = 0.0
course_deg = 0.0

[services.navigation.solution]
algorithm = "complementary_filter"

[services.navigation.solution.complementary_filter]
time_constant_s = 0.5
heading_reference = "relative"

[services.navigation.publish]
enabled = true
source = "navigation-service-android"

# Android owns the Bluetooth SPP connection. OpenRoadCode consumes the raw
# ELM327 byte stream over the bridge's localhost-only TCP endpoint.
[services.automotive]
enabled = true
rate_hz = 10.0

[services.automotive.input]
source = "device"
device = "elm327"
transport = "tcp"
host = "127.0.0.1"
tcp_port = 35000
timeout_s = 1.0
slow_poll_interval_s = 5.0

[services.automotive.publish]
enabled = true
source = "obd2"

[audio]
output = "auto"

[image_cache]
directory = "~/.cache/openroadcode/images"
max_entries = 24

[position_cache]
enabled = true
directory = "~/.cache/openroadcode/position"
max_age_seconds = 604800.0

[rigctl]
host = "127.0.0.1"
port = 4532

[environmental.barometric_sensor]
driver = "bmp388"
address = 0x77

[input.rotary_encoders]
volume_index = 0

[input.keyboard]
enabled = false

[[input.rotary_encoders.devices]]
driver = "seesaw"
address = 0x36

[[input.rotary_encoders.devices]]
driver = "seesaw"
address = 0x37

[[input.rotary_encoders.devices]]
driver = "seesaw"
address = 0x38

# RuntimeConfigParser still requires at least one radio stack. Disable it here;
# the Termux sensor profile is intentionally focused on hardware plumbing.
[[radios]]
key = "fm_radio"
config = "fm_radio.json"
backend = "rigctl"
launcher = "sdrpp"
enabled = false
