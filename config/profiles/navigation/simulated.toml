# Navigation input generated by software simulation.
[services.navigation.inputs.imu]
source = "simulation"

[services.navigation.inputs.imu.simulation]
profile = "driving"

[services.navigation.inputs.gps]
source = "simulation"

[services.navigation.inputs.gps.simulation]
profile = "driving"
latitude_deg = 42.8028
longitude_deg = -83.0127
speed_mps = 13.4
course_deg = 180.0

[services.navigation.publish]
source = "navigation-service-simulated"
