# OpenRoadCode Termux user-facing application configuration
#
# Termux X11 presents all OpenRoadCode application windows on the same X11
# display. Application lifecycle policy intentionally mirrors applications.toml;
# only presentation routing differs for the Android/Termux runtime.

[browser]
profile_root = "~/.local/share/openroadcode/browser"

[presentation]
default_target = "primary"

[presentation.targets.primary]
type = "x11"
display = ":1"

[presentation.targets.auxiliary]
type = "x11"
display = ":1"

[apps.weather]
type = "browser"
enabled = true
url = "http://127.0.0.1:8501"
profile = "weather"
startup = "preload"
exclusive_group = "auxiliary"

[apps.adsb]
type = "adsb"
enabled = true
url = "http://127.0.0.1:8081/"
profile = "adsb"
startup = "lazy"
exclusive_group = "auxiliary"

[apps.web_ui]
type = "browser"
enabled = true
url = "http://127.0.0.1:5000"
profile = "web-ui"
startup = "preload"

[apps.youtube]
type = "browser"
enabled = true
url = "https://www.youtube.com"
profile = "youtube"
startup = "lazy"

[apps.google_earth]
type = "browser"
enabled = true
url = "https://earth.google.com/web"
profile = "google-earth"
startup = "lazy"
target = "auxiliary"
exclusive_group = "auxiliary"
