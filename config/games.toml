# Native Linux games exposed by OpenRoadCode.
# Commands are argv arrays so arguments do not require shell parsing.
# Platform package names are kept separate from launch commands.

[[games]]
name = "Extreme Tux Racer"
description = "Race Tux down snowy courses."
command = ["extremetuxracer"]
enabled = true
[games.install]
termux_package = "extremetuxracer"

[[games]]
name = "SuperTuxKart"
description = "Native open-source kart racing."
command = ["supertuxkart"]
enabled = true
[games.install]
termux_package = "supertuxkart"

[[games]]
name = "Bovo"
description = "Gomoku / five-in-a-row board game."
command = ["bovo"]
enabled = true
[games.install]
termux_package = "bovo"

[[games]]
name = "KMines"
description = "Classic Minesweeper-style puzzle game."
command = ["kmines"]
enabled = true
[games.install]
termux_package = "kmines"
termux_dependencies = ["qt6-qtsvg"]

[[games]]
name = "KPatience"
description = "Collection of solitaire card games."
command = ["kpat"]
enabled = true
[games.install]
termux_package = "kpat"

[[games]]
name = "GNOME 2048"
description = "Sliding-tile 2048 puzzle game."
command = ["gnome-2048"]
enabled = true
[games.install]
termux_package = "gnome-2048"

[[games]]
name = "GNOME Nibbles"
description = "Snake-style arcade game with multiplayer support."
command = ["gnome-nibbles"]
enabled = true
[games.install]
termux_package = "gnome-nibbles"

[[games]]
name = "GNOME Sudoku"
description = "Touch-friendly Sudoku puzzle game."
command = ["gnome-sudoku"]
enabled = true
[games.install]
termux_package = "gnome-sudoku"
