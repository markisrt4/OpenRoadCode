# Native games exposed by OpenRoadCode.
# A game remains in the catalog even when the current runtime cannot install it.
# Platform-specific package metadata describes where it can be installed.

[[games]]
name = "Extreme Tux Racer"
description = "Race Tux down snowy courses."
category = "action"
icon = "etr"
command = ["etr"]
[games.install]
debian_package = "extremetuxracer"

[[games]]
name = "SuperTuxKart"
description = "Open-source kart racing."
category = "action"
icon = "supertuxkart"
command = ["supertuxkart", "--render-driver=gl", "--windowed"]
[games.install]
debian_package = "supertuxkart"

