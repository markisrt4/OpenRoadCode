# Native games exposed by OpenRoadCode.
# Commands are argv arrays so arguments do not require shell parsing.
# Categories drive the orcUi game filters; icons are resolved from the host theme.

[[games]]
name = "KMines"
description = "Classic Minesweeper-style puzzle game."
category = "puzzle"
icon = "kmines"
command = ["kmines"]
[games.install]
termux_package = "kmines"
termux_dependencies = ["qt6-qtsvg"]

