# OpenRoadCode navigation runtime configuration.
# Installed by the navigation stack for both Linux and Termux targets.
# Relative renderer paths are resolved below the platform runtime roots.

[map_renderer]
data_root = "/srv/openroadcode"
cache_root = "/var/cache/openroadcode"
style = "maps/styles/openroadcode.json"
cache = "maplibre.db"

[vehicle_marker]
# Supported modes: blue_dot, heading, vehicle
mode = "vehicle"
scale = 1.0
