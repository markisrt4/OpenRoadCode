<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORC · 3D map experiment</title>
<link rel="stylesheet" href="/sdk/Widgets/widgets.css"><link rel="stylesheet" href="/viewer.css">
<script>window.CESIUM_BASE_URL = '/sdk/';</script><script src="/sdk/Cesium.js"></script>
<script src="/local_terrain.js" defer></script>
<script src="/reference_grid.js" defer></script>
<script src="/local_buildings.js" defer></script>
<script src="/local_map_tiles.js" defer></script>
<script src="/camera_controls.js" defer></script>
<script src="/viewer.js" defer></script>
</head>
<body>
<div id="map" aria-label="Interactive 3D globe"></div>
<header><strong id="destination">3D map</strong><button id="close">Return to ORC</button></header>
<button id="controls-toggle" aria-controls="map-controls" aria-expanded="false" hidden>Controls</button>
<nav id="map-controls" aria-label="Map controls">
<button id="zoom-in" aria-label="Zoom in">＋</button><button id="zoom-out" aria-label="Zoom out">−</button>
<div class="pan-controls" role="group" aria-label="Pan map">
<button id="pan-up" aria-label="Pan forward in the current view">↑</button>
<button id="pan-left" aria-label="Pan left in the current view">←</button>
<button id="pan-right" aria-label="Pan right in the current view">→</button>
<button id="pan-down" aria-label="Pan backward in the current view">↓</button>
</div>
<button id="terrain" aria-pressed="true">Terrain</button>
<button id="terrain-scale" aria-label="Cycle terrain scale: 1, 2, or 3 times">Relief 1×</button>
<button id="buildings" aria-pressed="true">Buildings</button>
<button id="references" aria-pressed="false">Grid</button>
<button id="pitch-up" aria-label="More tilt: view the destination from a lower angle">More tilt</button>
<button id="pitch-down" aria-label="Less tilt: view the destination from above">Less tilt</button>
<button id="north">North</button><button id="tilt">2D / 3D</button><button id="reset">Reset view</button>
</nav>
<footer><span id="status" role="status">Loading local globe…</span><span id="tiles-status" role="status"></span><span id="terrain-status" role="status"></span><span id="camera" aria-label="Camera position"></span></footer>
</body></html>
