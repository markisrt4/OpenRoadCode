<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORC · 3D map experiment</title>
<link rel="stylesheet" href="/sdk/Widgets/widgets.css"><link rel="stylesheet" href="/viewer.css">
<script>window.CESIUM_BASE_URL = '/sdk/';</script><script src="/sdk/Cesium.js"></script>
<script src="/viewer.js" defer></script>
</head>
<body>
<div id="map" aria-label="Interactive 3D globe"></div>
<header><strong id="destination">3D map</strong><button id="close">Return to ORC</button></header>
<nav aria-label="Map controls">
<button id="zoom-in" aria-label="Zoom in">＋</button><button id="zoom-out" aria-label="Zoom out">−</button>
<button id="north">North</button><button id="tilt">2D / 3D</button><button id="reset">Reset view</button>
</nav>
<footer><span id="status" role="status">Loading local globe…</span></footer>
</body></html>
